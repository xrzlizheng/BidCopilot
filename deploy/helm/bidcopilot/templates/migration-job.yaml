apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "bidcopilot.fullname" . }}-migrate
  labels:
    {{- include "bidcopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "bidcopilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "bidcopilot.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          workingDir: /opt/bidcopilot/backend
          env:
            # 口令不落 Job spec 明文，从 Secret 引用。
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bidcopilot.secretName" . }}
                  key: DATABASE_URL
