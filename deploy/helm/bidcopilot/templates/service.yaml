apiVersion: v1
kind: Service
metadata:
  name: {{ include "bidcopilot.fullname" . }}
  labels:
    {{- include "bidcopilot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.bidcopilot.port }}
      targetPort: http
  selector:
    {{- include "bidcopilot.selectorLabels" . | nindent 4 }}
