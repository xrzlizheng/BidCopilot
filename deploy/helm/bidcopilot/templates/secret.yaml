{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bidcopilot.secretName" . }}
  labels:
    {{- include "bidcopilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey is required" .Values.secrets.jwtSecretKey | quote }}
  MODEL_SECRET_MASTER_KEY: {{ required "secrets.modelSecretMasterKey is required (base64 32 bytes); do not rely on per-pod random keys" .Values.secrets.modelSecretMasterKey | quote }}
  KEEPRISK_APP_CODE: {{ .Values.secrets.keepriskAppCode | default "" | quote }}
  KEEPRISK_MCP_TOKEN: {{ .Values.secrets.keepriskMcpToken | default "" | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | default "" | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | default "" | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | default "" | quote }}
  MINIMAX_API_KEY: {{ .Values.secrets.minimaxApiKey | default "" | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | default "" | quote }}
{{- end }}
